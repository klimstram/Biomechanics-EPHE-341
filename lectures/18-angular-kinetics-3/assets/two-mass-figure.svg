<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220"
     role="img" aria-label="A bar with a 10 kg mass 0.25 m from point A and a second 10 kg mass 0.75 m from A, with the centre of gravity marked midway at 0.50 m" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- drawn in currentColor so it follows the deck's light and dark themes -->
  <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <line x1="40" y1="110" x2="470" y2="110"/>
  </g>
  <circle cx="40" cy="110" r="7" fill="currentColor"/>
  <text x="40" y="92" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="17" font-weight="700" fill="currentColor">A</text>

  <!-- the two masses, at 0.25 m and 0.75 m -->
  <g fill="#1f6fb2" stroke="#fdfdfc" stroke-width="2.5">
    <circle cx="150" cy="110" r="21"/>
    <circle cx="362" cy="110" r="21"/>
  </g>
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700"
     text-anchor="middle" fill="currentColor">
    <text x="150" y="80">10 kg</text>
    <text x="362" y="80">10 kg</text>
    <text x="150" y="152" font-size="13" font-weight="600">m&#8321;</text>
    <text x="362" y="152" font-size="13" font-weight="600">m&#8322;</text>
  </g>

  <!-- the centre of gravity, midway -->
  <circle cx="256" cy="110" r="7" fill="#3f8f5c"/>
  <line x1="256" y1="62" x2="256" y2="158" stroke="#3f8f5c" stroke-width="2"
        stroke-dasharray="5 4"/>
  <text x="256" y="54" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="14" font-weight="700" fill="#3f8f5c">CofG</text>

  <!-- the measured distances -->
  <g stroke="currentColor" stroke-width="1.6" opacity="0.75">
    <line x1="40" y1="182" x2="150" y2="182"/>
    <line x1="40" y1="176" x2="40" y2="188"/>
    <line x1="150" y1="176" x2="150" y2="188"/>
    <line x1="150" y1="182" x2="362" y2="182"/>
    <line x1="362" y1="176" x2="362" y2="188"/>
  </g>
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600"
     text-anchor="middle" fill="currentColor">
    <text x="95" y="204">0.25 m</text>
    <text x="256" y="204">0.50 m</text>
  </g>
</svg>
